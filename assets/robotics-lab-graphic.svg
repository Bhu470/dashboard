<svg width="1440" height="760" viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ROS2 autonomous robot development graphic</title>
  <desc id="desc">A stylized robotics lab dashboard with a mobile robot, ROS2 nodes, Gazebo simulation, TF2 validation, and embedded sensor signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07110F"/>
      <stop offset="0.48" stop-color="#10231F"/>
      <stop offset="1" stop-color="#0A1614"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17332D" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#0A1714" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38D996"/>
      <stop offset="1" stop-color="#69C8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#EDF7F2" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

